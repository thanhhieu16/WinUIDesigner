# Runs .github/walkthrough/steps.txt against the real shell app with synthetic input, and
# publishes the screenshots to refs/walkthrough/latest (see walkthrough.ps1). Runs when the app
# or the walkthrough changes, or on demand.
name: Walkthrough

on:
  push:
    branches: ['claude/**']
    paths: ['src/**', '.github/walkthrough/**', '.github/workflows/walkthrough.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  walkthrough:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WinUIDesigner.sln

      - name: Walk
        shell: pwsh
        env:
          WINUIDESIGNER_TRACE: ${{ runner.temp }}\trace.log
        run: >
          ./.github/walkthrough/walkthrough.ps1
          -Exe src/WinUIDesigner.Shell.App/bin/Debug/net10.0-windows10.0.19041.0/win-x64/WinUIDesigner.Shell.App.exe
          -Steps .github/walkthrough/steps.txt
          -OutDir walkthrough-shots

      - name: Show the saved file
        if: always()
        shell: pwsh
        run: |
          $saved = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'walk.xaml'
          if (Test-Path $saved) { Get-Content $saved; Copy-Item $saved walkthrough-shots/ } else { Write-Host 'no saved file' }

      - name: Show the trace
        if: always()
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'trace.log'
          if (Test-Path $t) { Get-Content $t; Copy-Item $t walkthrough-shots/ } else { Write-Host 'no trace' }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-shots
          path: walkthrough-shots/

      # The screenshots also go to refs/walkthrough/latest - a ref, not a branch, so they never
      # appear in a branch or a pull request - where `git fetch origin refs/walkthrough/latest`
      # can reach them from an environment that cannot download Actions artifacts.
      - name: Publish screenshots to a ref
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path walkthrough-shots)) { exit 0 }
          Set-Location walkthrough-shots
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -qm "walkthrough ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/walkthrough/latest
