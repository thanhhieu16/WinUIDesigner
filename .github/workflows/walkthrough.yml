# Runs .github/walkthrough/steps.txt against the real shell app with synthetic input, and
# publishes the screenshots to refs/walkthrough/latest (see walkthrough.ps1). Runs when the app
# or the walkthrough changes, or on demand.
name: Walkthrough

on:
  push:
    branches: ['claude/**']
    paths: ['src/**', 'samples/**', '.github/walkthrough/**', '.github/workflows/walkthrough.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  walkthrough:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WinUIDesigner.sln

      # The sample control library, where File > Add Controls Assembly... finds it: Documents is
      # the picker's start folder. Only the library's own files: the build output also holds
      # WebView2's native .dlls, which sort first in the picker and are (rightly) refused. The
      # library-layout folder named after the library holds its processed XAML
      # (Themes/Generic.xaml), which the shell loads for the library's templated controls.
      - name: Put the sample controls in Documents
        shell: pwsh
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          foreach ($name in 'WinUIDesigner.SampleControls', 'WinUIDesigner.SampleBrokenTheme') {
            $out = "samples/$name/bin/Debug/net10.0-windows10.0.19041.0/win-x64"
            Get-ChildItem -File "$out/$name.*" | Copy-Item -Destination $docs
            if (Test-Path "$out/$name") { Copy-Item -Recurse "$out/$name" $docs }
          }
          Get-ChildItem $docs | Select-Object Name

      # A real NuGet control library, CommunityToolkit's Segmented, with the two packages it
      # depends on: lib/<tfm> only, as a package carries it (a .dll and a .pri, no XAML text).
      # In the user folder, not Documents: a folder there sorts first in the pickers and moves
      # every row the walkthrough double-clicks.
      - name: Put CommunityToolkit's Segmented in the user folder
        shell: pwsh
        run: |
          $dest = Join-Path $env:USERPROFILE 'Toolkit'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $packages = @(
            @('communitytoolkit.winui.controls.segmented', '8.2.251219', 'net8.0-windows10.0.19041'),
            @('communitytoolkit.winui.extensions', '8.2.251219', 'net8.0-windows10.0.19041'),
            @('communitytoolkit.common', '8.2.1', 'netstandard2.0')
          )
          foreach ($p in $packages) {
            $zip = Join-Path $env:RUNNER_TEMP "$($p[0]).zip"
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$($p[0])/$($p[1])/$($p[0]).$($p[1]).nupkg" -OutFile $zip
            $x = Join-Path $env:RUNNER_TEMP $p[0]
            Expand-Archive $zip $x -Force
            Get-ChildItem -File "$x/lib/$($p[2])" | Where-Object { $_.Extension -in '.dll', '.pri' } | Copy-Item -Destination $dest
          }
          Get-ChildItem $dest | Select-Object Name, Length

      - name: Walk
        shell: pwsh
        env:
          WINUIDESIGNER_RESOURCE_TRACE: ${{ runner.temp }}/resource-trace.txt
        run: >
          ./.github/walkthrough/walkthrough.ps1
          -Exe src/WinUIDesigner.Shell.App/bin/Debug/net10.0-windows10.0.19041.0/win-x64/WinUIDesigner.Shell.App.exe
          -Steps .github/walkthrough/steps.txt
          -OutDir walkthrough-shots

      # The resource lookups the app routed to library .pri files (WINUIDESIGNER_RESOURCE_TRACE).
      - name: Show the resource trace
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:RUNNER_TEMP/resource-trace.txt") { Get-Content "$env:RUNNER_TEMP/resource-trace.txt" } else { Write-Host 'no trace' }

      - name: Show the saved file
        if: always()
        shell: pwsh
        run: |
          $saved = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'walk.xaml'
          if (Test-Path $saved) { Get-Content $saved; Copy-Item $saved walkthrough-shots/ } else { Write-Host 'no saved file' }
          $exported = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'walk-export.png'
          if (Test-Path $exported) { Get-Item $exported | Format-List Name, Length; Copy-Item $exported walkthrough-shots/35d-exported-file.png } else { Write-Host 'no exported image' }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-shots
          path: walkthrough-shots/

      # The screenshots also go to refs/walkthrough/latest - a ref, not a branch, so they never
      # appear in a branch or a pull request - where `git fetch origin refs/walkthrough/latest`
      # can reach them from an environment that cannot download Actions artifacts.
      - name: Publish screenshots to a ref
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path walkthrough-shots)) { exit 0 }
          Set-Location walkthrough-shots
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -qm "walkthrough ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/walkthrough/latest
